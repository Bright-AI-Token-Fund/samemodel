name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e . pytest ruff
      - run: ruff check src tests
      - run: python -m pytest -q
      - name: The demo in the README runs
        run: |
          samemodel mock --port 8642 --cache-drift 0.08 &
          sleep 2
          samemodel selfcheck --base-url http://127.0.0.1:8642 -n 10 --max-tokens 48
