[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "samemodel"
dynamic = ["version"]
description = "Measure whether an LLM inference endpoint still serves the same model after a cache hit, co-batching, a backend or a quantization change."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
dependencies = []
keywords = ["llm", "inference", "determinism", "batch-invariance", "quantization", "llama.cpp", "vllm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Testing",
]

[project.urls]
Repository = "https://github.com/Bright-AI-Token-Fund/samemodel"

[project.scripts]
samemodel = "samemodel.cli:main"

[tool.hatch.version]
path = "src/samemodel/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/samemodel"]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
